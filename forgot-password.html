<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>Study Hub</h1>
        <p class="subtitle">Reset your account password</p>

        <div id="message" style="margin-bottom: 15px; text-align: center; display: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: 500;"></div>

        <form id="reset-password-form">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
            >

            <label for="student-id">Student ID</label>
            <input
                type="text"
                id="student-id"
                placeholder="Enter your Student ID"
                required
            >

            <label for="new-password">New Password</label>
            <input
                type="password"
                id="new-password"
                placeholder="Enter new password"
                required
            >

            <label for="confirm-password">Confirm New Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">Reset Password</button>

        </form>

        <p class="account-text">
            Remembered your password?
            <a href="index.html">Login</a>
        </p>

    </div>

</div>

<script>
    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const studentId = document.getElementById('student-id').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const messageDiv = document.getElementById('message');

        messageDiv.style.display = 'none';
        messageDiv.style.backgroundColor = 'transparent';

        if (newPassword !== confirmPassword) {
            messageDiv.textContent = 'Passwords do not match.';
            messageDiv.style.color = '#ff4d4d';
            messageDiv.style.backgroundColor = '#fef2f2';
            messageDiv.style.border = '1px solid #fee2e2';
            messageDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, studentId, newPassword })
            });

            const data = await response.json();
            if (response.ok) {
                messageDiv.textContent = 'Password reset successfully! Redirecting to login...';
                messageDiv.style.color = '#10b981';
                messageDiv.style.backgroundColor = '#ecfdf5';
                messageDiv.style.border = '1px solid #d1fae5';
                messageDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'index.html?reset=success';
                }, 2000);
            } else {
                messageDiv.textContent = data.error || 'Failed to reset password.';
                messageDiv.style.color = '#ff4d4d';
                messageDiv.style.backgroundColor = '#fef2f2';
                messageDiv.style.border = '1px solid #fee2e2';
                messageDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Reset password error:', error);
            messageDiv.textContent = 'A network error occurred. Please try again.';
            messageDiv.style.color = '#ff4d4d';
            messageDiv.style.backgroundColor = '#fef2f2';
            messageDiv.style.border = '1px solid #fee2e2';
            messageDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
