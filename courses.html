<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Courses</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .courses-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .courses-section {
            flex: 2;
            min-width: 300px;
        }
        .create-section {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            align-self: flex-start;
        }
        .create-section input, .create-section textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .create-section button {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .create-section button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<body>

<nav>
    <h2>Study Hub</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="notes.html">Notes</a>
        <a href="uploads.html">Uploads</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
    </div>
</nav>

<main class="page">

    <h1>My Courses</h1>
    <p class="welcome-text">Courses you are currently studying.</p>

    <div class="courses-container">
        
        <div class="courses-section">
            <div class="course-list" id="course-list">
                <!-- Courses will be loaded here dynamically -->
            </div>
        </div>

        <div class="create-section">
            <h3>Add New Course</h3>
            <form id="create-course-form">
                <label for="course-name" style="display:block; margin-bottom: 6px; font-size:14px; font-weight:600;">Course Name</label>
                <input type="text" id="course-name" placeholder="Course Name" required>

                <label for="course-description" style="display:block; margin-bottom: 6px; font-size:14px; font-weight:600;">Description</label>
                <textarea id="course-description" rows="5" placeholder="Description of the course..." required></textarea>

                <button type="submit">Create Course</button>
            </form>
        </div>

    </div>

</main>

<script>
    async function loadCourses() {
        try {
            const response = await fetch('/api/courses');
            if (response.status === 401) {
                window.location.href = 'index.html';
                return;
            }
            const courses = await response.json();
            const courseList = document.getElementById('course-list');
            courseList.innerHTML = '';

            if (courses.length === 0) {
                courseList.innerHTML = '<p style="color: #666;">No courses available. Create your first course on the right!</p>';
                return;
            }

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.style.display = 'flex';
                card.style.flexDirection = 'column';
                card.innerHTML = `
                    <h3>${course.name}</h3>
                    <p style="margin-bottom: 20px; flex-grow: 1;">${course.description || ''}</p>
                    <div style="display: flex; gap: 8px; margin-top: auto; width: 100%;">
                        <button class="view-notes-btn" style="flex: 1; font-size: 13px; padding: 8px 12px; font-weight: 600;">Notes</button>
                        <button class="view-uploads-btn" style="flex: 1; font-size: 13px; padding: 8px 12px; font-weight: 600; background: #e2e8f0; color: #1f2937; border: 1px solid #cbd5e1;">Uploads</button>
                    </div>
                `;
                
                card.querySelector('.view-notes-btn').addEventListener('click', () => {
                    window.location.href = `notes.html?courseId=${course.id}`;
                });
                
                card.querySelector('.view-uploads-btn').addEventListener('click', () => {
                    window.location.href = `uploads.html?courseId=${course.id}`;
                });

                courseList.appendChild(card);
            });
        } catch (error) {
            console.error('Error fetching courses:', error);
        }
    }

    document.getElementById('create-course-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('course-name').value;
        const description = document.getElementById('course-description').value;

        try {
            const response = await fetch('/api/courses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });

            if (response.ok) {
                document.getElementById('course-name').value = '';
                document.getElementById('course-description').value = '';
                loadCourses();
            } else {
                const data = await response.json();
                alert('Failed to save course: ' + (data.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error saving course:', error);
        }
    });

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'index.html';
        } catch (error) {
            console.error('Logout error:', error);
        }
    });

    window.addEventListener('DOMContentLoaded', loadCourses);
</script>

</body>
</html>
