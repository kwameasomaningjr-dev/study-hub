<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Courses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Study Hub</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="notes.html">Notes</a>
        <a href="uploads.html">Uploads</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
    </div>
</nav>

<main class="page">

    <h1>My Courses</h1>
    <p class="welcome-text">Courses you are currently studying.</p>

    <div class="course-list" id="course-list">
        <!-- Courses will be loaded here dynamically -->
    </div>

</main>

<script>
    async function loadCourses() {
        try {
            const response = await fetch('/api/courses');
            if (response.status === 401) {
                window.location.href = 'index.html';
                return;
            }
            const courses = await response.json();
            const courseList = document.getElementById('course-list');
            courseList.innerHTML = '';

            if (courses.length === 0) {
                courseList.innerHTML = '<p>No courses available.</p>';
                return;
            }

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <h3>${course.name}</h3>
                    <p>${course.description || ''}</p>
                    <button class="view-btn">View Course</button>
                `;
                
                card.querySelector('.view-btn').addEventListener('click', () => {
                    window.location.href = `notes.html?courseId=${course.id}`;
                });

                courseList.appendChild(card);
            });
        } catch (error) {
            console.error('Error fetching courses:', error);
        }
    }

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'index.html';
        } catch (error) {
            console.error('Logout error:', error);
        }
    });

    window.addEventListener('DOMContentLoaded', loadCourses);
</script>

</body>
</html>
