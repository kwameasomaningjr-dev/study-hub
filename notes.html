<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Notes</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notes-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .notes-section {
            flex: 2;
            min-width: 300px;
        }
        .create-section {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            align-self: flex-start;
        }
        .create-section input, .create-section textarea, .create-section select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .create-section button {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .create-section button:hover {
            background: var(--primary-hover);
        }
        .note-card {
            position: relative;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover {
            background: #dc2626;
        }
        .course-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<nav>
    <h2>Study Hub</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="notes.html">Notes</a>
        <a href="uploads.html">Uploads</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
    </div>
</nav>

<main class="page">

    <h1>My Notes</h1>
    <p class="welcome-text">Your saved study notes.</p>

    <div class="notes-container">
        
        <div class="notes-section">
            <div class="notes-list" id="notes-list">
                <!-- Notes will be loaded dynamically here -->
            </div>
        </div>

        <div class="create-section">
            <h3>Add New Note</h3>
            <form id="create-note-form">
                <label for="note-title">Title</label>
                <input type="text" id="note-title" placeholder="Note Title" required>

                <label for="note-course">Course</label>
                <select id="note-course">
                    <option value="">No Course Associated</option>
                    <!-- Course options loaded dynamically -->
                </select>

                <label for="note-content">Content</label>
                <textarea id="note-content" rows="6" placeholder="Write your notes here..." required></textarea>

                <button type="submit">Save Note</button>
            </form>
        </div>

    </div>

</main>

<script>
    async function loadNotesAndCourses() {
        try {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const filterCourseId = urlParams.get('courseId');

            // Load courses first to populate select options
            const courseRes = await fetch('/api/courses');
            if (courseRes.status === 401) {
                window.location.href = 'index.html';
                return;
            }
            const courses = await courseRes.json();
            const courseSelect = document.getElementById('note-course');
            
            // Clear current options except the first
            courseSelect.innerHTML = '<option value="">No Course Associated</option>';
            courses.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                courseSelect.appendChild(opt);
            });

            if (filterCourseId) {
                courseSelect.value = filterCourseId;
            }

            // Load notes
            const notesRes = await fetch('/api/notes');
            let notes = await notesRes.json();
            
            if (filterCourseId) {
                notes = notes.filter(n => n.courseId === Number(filterCourseId));
            }

            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '';

            if (notes.length === 0) {
                notesList.innerHTML = filterCourseId
                    ? '<p style="color: #666;">No notes saved for this course yet. Write your first note on the right!</p>'
                    : '<p style="color: #666;">No notes saved yet. Write your first note on the right!</p>';
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                
                const courseBadge = note.Course 
                    ? `<span class="course-badge">${note.Course.name}</span>`
                    : '';

                card.innerHTML = `
                    <h3>${note.title}</h3>
                    <p>${note.content}</p>
                    ${courseBadge}
                    <button class="delete-btn" onclick="deleteNote(${note.id})">Delete</button>
                `;
                notesList.appendChild(card);
            });

        } catch (error) {
            console.error('Error loading notes and courses:', error);
        }
    }

    document.getElementById('create-note-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('note-title').value;
        const courseId = document.getElementById('note-course').value;
        const content = document.getElementById('note-content').value;

        try {
            const response = await fetch('/api/notes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content, courseId: courseId || null })
            });

            if (response.ok) {
                document.getElementById('note-title').value = '';
                document.getElementById('note-course').value = '';
                document.getElementById('note-content').value = '';
                loadNotesAndCourses();
            } else {
                const data = await response.json();
                alert('Failed to save note: ' + (data.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error saving note:', error);
        }
    });

    async function deleteNote(id) {
        if (!confirm('Are you sure you want to delete this note?')) return;
        try {
            const response = await fetch(`/api/notes/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                loadNotesAndCourses();
            } else {
                alert('Failed to delete note');
            }
        } catch (error) {
            console.error('Error deleting note:', error);
        }
    }

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'index.html';
        } catch (error) {
            console.error('Logout error:', error);
        }
    });

    window.addEventListener('DOMContentLoaded', loadNotesAndCourses);
</script>

</body>
</html>
