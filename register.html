<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h1>Study Hub</h1>
        <p class="subtitle">Create your student account</p>

        <div id="error-message" style="color: #ff4d4d; margin-bottom: 15px; text-align: center; display: none;"></div>

        <form id="register-form">

            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
            >

            <label for="student-id">Student ID</label>
            <input
                type="text"
                id="student-id"
                placeholder="Enter your student ID"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <label for="confirm-password">Confirm Password</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p class="account-text">
            Already have an account?
            <a href="index.html">Login</a>
        </p>

    </div>

</div>

<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullname = document.getElementById('fullname').value;
        const studentId = document.getElementById('student-id').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const errorDiv = document.getElementById('error-message');

        errorDiv.style.display = 'none';

        if (password !== confirmPassword) {
            errorDiv.textContent = 'Passwords do not match.';
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullname, studentId, email, password })
            });

            const data = await response.json();
            if (response.ok) {
                window.location.href = 'dashboard.html';
            } else {
                errorDiv.textContent = data.error || 'Registration failed';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            console.error('Registration error:', error);
            errorDiv.textContent = 'A network error occurred. Please try again.';
            errorDiv.style.display = 'block';
        }
    });
</script>

</body>
</html>
