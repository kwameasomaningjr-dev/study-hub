<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Study Hub</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="courses.html">Courses</a>
        <a href="notes.html">Notes</a>
        <a href="uploads.html">Uploads</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
    </div>
</nav>

<main class="dashboard">

    <h1>Welcome to Study Hub, <span id="user-name">Student</span></h1>
    <p class="welcome-text">Access your study materials and courses.</p>

    <div class="dashboard-cards">

        <div class="dashboard-card">
            <h3>Courses</h3>
            <p id="courses-count">0</p>
            <a href="courses.html">View Courses</a>
        </div>

        <div class="dashboard-card">
            <h3>Notes</h3>
            <p id="notes-count">0</p>
            <a href="notes.html">View Notes</a>
        </div>

        <div class="dashboard-card">
            <h3>Uploads</h3>
            <p id="uploads-count">0</p>
            <a href="uploads.html">View Uploads</a>
        </div>

    </div>

    <section class="recent">
        <h2>Recent Materials</h2>
        <div id="recent-list">
            <p style="color: #888;">No recent materials found.</p>
        </div>
    </section>

</main>

<script>
    async function loadDashboard() {
        try {
            const response = await fetch('/api/dashboard');
            if (response.status === 401) {
                window.location.href = 'index.html';
                return;
            }
            
            const data = await response.json();
            
            document.getElementById('user-name').textContent = data.fullname || 'Student';
            document.getElementById('courses-count').textContent = data.stats.courses;
            document.getElementById('notes-count').textContent = data.stats.notes;
            document.getElementById('uploads-count').textContent = data.stats.uploads;

            const recentList = document.getElementById('recent-list');
            recentList.innerHTML = '';

            const items = [];
            
            // Combine and sort recent notes and uploads by updated/created time
            if (data.recentNotes) {
                data.recentNotes.forEach(n => {
                    items.push({
                        type: 'note',
                        title: n.title,
                        time: new Date(n.createdAt),
                        icon: '📝',
                        url: 'notes.html'
                    });
                });
            }

            if (data.recentUploads) {
                data.recentUploads.forEach(u => {
                    items.push({
                        type: 'upload',
                        title: u.filename,
                        time: new Date(u.createdAt),
                        icon: '📁',
                        url: 'uploads.html'
                    });
                });
            }

            // Sort newest first
            items.sort((a, b) => b.time - a.time);

            if (items.length === 0) {
                recentList.innerHTML = '<p style="color: #666;">No recent materials found. Get started by creating notes or uploading files!</p>';
                return;
            }

            items.slice(0, 4).forEach(item => {
                const timeDiff = timeAgo(item.time);
                const div = document.createElement('div');
                div.className = 'material';
                div.innerHTML = `
                    <span>${item.icon}</span>
                    <div>
                        <strong><a href="${item.url}" style="color: inherit; text-decoration: none;">${item.title}</a></strong>
                        <p>${timeDiff}</p>
                    </div>
                `;
                recentList.appendChild(div);
            });

        } catch (error) {
            console.error('Error fetching dashboard details:', error);
        }
    }

    function timeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        let interval = Math.floor(seconds / 31536000);

        if (interval >= 1) return interval + " year" + (interval > 1 ? "s" : "") + " ago";
        interval = Math.floor(seconds / 2592000);
        if (interval >= 1) return interval + " month" + (interval > 1 ? "s" : "") + " ago";
        interval = Math.floor(seconds / 86400);
        if (interval >= 1) return interval + " day" + (interval > 1 ? "s" : "") + " ago";
        interval = Math.floor(seconds / 3600);
        if (interval >= 1) return interval + " hour" + (interval > 1 ? "s" : "") + " ago";
        interval = Math.floor(seconds / 60);
        if (interval >= 1) return interval + " minute" + (interval > 1 ? "s" : "") + " ago";
        return seconds < 10 ? "Just now" : Math.floor(seconds) + " seconds ago";
    }

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = 'index.html';
        } catch (error) {
            console.error('Logout error:', error);
        }
    });

    window.addEventListener('DOMContentLoaded', loadDashboard);
</script>

</body>
</html>
